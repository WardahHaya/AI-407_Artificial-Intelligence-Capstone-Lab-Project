services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buraq-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_SSL: "false"
      CHECKPOINT_DB_PATH: /app/runtime/checkpoint_db.sqlite
    depends_on:
      - chroma
    volumes:
      - checkpoint_data:/app/runtime
    networks:
      - buraq-net

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: buraq-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - buraq-net

networks:
  buraq-net:
    driver: bridge

volumes:
  chroma_data:
  checkpoint_data:
