name: Agent Quality Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simulate_breaking_change:
        description: "Run the evaluation gate in break mode to verify the workflow fails on degraded quality."
        required: false
        default: false
        type: boolean

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' && 'true' || 'false' }}
      TEST_DATASET_PATH: test_dataset.json
      EVAL_THRESHOLD_CONFIG_PATH: eval_thresholds.json
      EVAL_SUMMARY_RESULTS_PATH: ci_eval_results.json
      BREAK_AGENT_FOR_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_breaking_change && 'true' || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t buraq-agent-ci .

      - name: Run evaluation gate
        run: python run_eval.py

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-artifacts
          path: |
            evaluation_results.json
            evaluation_report.md
            ci_eval_results.json
